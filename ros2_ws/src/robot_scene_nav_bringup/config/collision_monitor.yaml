collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    polygons: [Stop, Slowdown]
    observation_sources: [scan]
    # EXAMPLE ONLY. Measure the real robot footprint before NAV2_ALLOW_EXECUTE=true.
    Stop: {type: polygon, points: "[[0.45, 0.30], [0.45, -0.30], [-0.35, -0.30], [-0.35, 0.30]]", action_type: stop, min_points: 4}
    Slowdown: {type: polygon, points: "[[0.8, 0.5], [0.8, -0.5], [-0.6, -0.5], [-0.6, 0.5]]", action_type: slowdown, slowdown_ratio: 0.35, min_points: 4}
    scan: {type: scan, topic: scan, min_height: 0.05, max_height: 1.5, enabled: true}
