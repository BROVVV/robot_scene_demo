# GO2-W 自主搜索单链路碰撞监视（计划书 §6.4）。
#
# 只有一个停止区和一个减速区，都是按 GO2-W 实际 footprint 生成的矩形顶点：
#   停止区：前方 0.60 m、后方 0.40 m、左右各 0.35 m
#   减速区：前方 1.00 m、后方 0.60 m、左右各 0.60 m
# 停止区触发输出零速度；减速区触发速度比例 0.35。
# points 在 Humble 里是扁平的 double 数组，不是嵌套数组。
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom_fused
    cmd_vel_in_topic: /cmd_vel_nav_smoothed
    cmd_vel_out_topic: /go2w/nav2_cmd_vel
    transform_tolerance: 0.3
    source_timeout: 0.30
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [Stop, Slowdown]
    Stop:
      type: "polygon"
      points: [0.60, 0.35, 0.60, -0.35, -0.40, -0.35, -0.40, 0.35]
      action_type: "stop"
      max_points: 4
      visualize: false
      enabled: true
    Slowdown:
      type: "polygon"
      points: [1.00, 0.60, 1.00, -0.60, -0.60, -0.60, -0.60, 0.60]
      action_type: "slowdown"
      slowdown_ratio: 0.35
      max_points: 4
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: "scan"
      topic: /go2w/lidar/scan
      enabled: true
