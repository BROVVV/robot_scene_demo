# GO2-W 自主搜索单链路 Nav2 参数（计划书 §6.3 / §6.4）。
#
# 坐标链固定为 map -> odom_fused -> base_link，唯一的 TF 发布者是
# plain_slam_nav_frame_bridge.py。这里没有 amcl，也没有 map_server：位姿由
# plain_slam 提供，/map 由坐标桥独家发布（旧的地图 relay 不再启动）。
#
# velocity_smoother 在 Humble 里没有 cmd_vel_in_topic / cmd_vel_out_topic 参数，
# 它的输入输出固定叫 cmd_vel / cmd_vel_smoothed，只能在 launch 里 remap。
# collision_monitor 有这两个参数，所以直接写在它自己的 yaml 里。

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /go2w/odom/fused
    bt_loop_duration: 10
    default_server_timeout: 20
    # plugin_lib_names 必须显式给。Foxy 0.4.7 的 nav2_bt_navigator 二进制内置默认值
    # 里有 nav2_change_goal_node_bt_node，而同版本的 ros-foxy-nav2-behavior-tree
    # 只装了 24 个库、里面没有 change_goal（dpkg -V 干净，不是这台机器装坏了）。
    # 于是 bt_navigator 在 configure 阶段 "Could not load library" 失败，
    # lifecycle_manager 跟着 "Failed to bring up all requested nodes. Aborting bringup."
    # 这里只列 behavior_trees/navigate_to_pose_robot_scene.xml 用到的节点。该 XML 的
    # 节点类型是固定的，将来若改了 XML 而漏列，configure 阶段会立刻报出来。
    # ReactiveFallback 是 BT.CPP 内建控制节点，不需要库，所以不在表里。
    plugin_lib_names:
      - nav2_clear_costmap_service_bt_node          # ClearEntireCostmap
      - nav2_compute_path_to_pose_action_bt_node    # ComputePathToPose
      - nav2_follow_path_action_bt_node             # FollowPath
      - nav2_goal_updated_condition_bt_node         # GoalUpdated
      - nav2_pipeline_sequence_bt_node              # PipelineSequence
      - nav2_rate_controller_bt_node                # RateController
      - nav2_recovery_node_bt_node                  # RecoveryNode
      - nav2_round_robin_node_bt_node               # RoundRobin
      - nav2_wait_action_bt_node                    # Wait
    # BT XML 的绝对路径由 launch 填成仓库自带的 navigate_to_pose_robot_scene.xml
    # （只有 ComputePathToPose + FollowPath，恢复分支只清代价地图和等待，不会
    # backup / drive_on_heading）。参数名在两个 distro 上不同，见 launch。

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /go2w/odom/fused
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 8.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 保守初值：线速度上限与速度桥一致，巡航速度由走廊分析按段覆盖。
      desired_linear_vel: 0.10
      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.45
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.80
      cost_scaling_gain: 0.50
      regulated_linear_scaling_min_speed: 0.05
      max_angular_accel: 0.80
      transform_tolerance: 0.3

behavior_server:
  ros__parameters:
    global_frame: odom_fused
    robot_base_frame: base_link
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # 只保留无平移的行为：backup / drive_on_heading / assisted_teleop 会让机器人
    # 在没经过走廊分析的情况下位移，因此不注册。树里也不会调用它们。
    behavior_plugins: [spin, wait]
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.80

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # Unitree Go2-W 官方站立外廓 0.70 x 0.43 m，以 base_link 为中心。
      footprint: "[[0.35, 0.215], [0.35, -0.215], [-0.35, -0.215], [-0.35, 0.215]]"
      footprint_padding: 0.04
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: false
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /go2w/lidar/scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 有梯度的软代价：宽走廊中线代价最低，窄走廊仍可在满足 footprint 与
        # 硬安全距离时通过（计划书 §6.4 的说明）。
        inflation_radius: 1.00
        cost_scaling_factor: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom_fused
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      footprint: "[[0.35, 0.215], [0.35, -0.215], [-0.35, -0.215], [-0.35, 0.215]]"
      footprint_padding: 0.04
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /go2w/lidar/scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.00
        cost_scaling_factor: 2.0

# velocity_smoother 的参数只在 config/velocity_smoother.yaml 里写一份，由 launch
# 传给该节点；同一个参数不在两个文件里各写一遍。
