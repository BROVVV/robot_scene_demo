# Formal PandarXT-16 extrinsics slot relative to base_link.
#
# This file is deliberately NOT confirmed. It is seeded from the
# photo/static-registration candidate so the hardware state manifest can bind
# to a stable config path. Until a multi-scene calibration passes the
# translation/yaw thresholds, the candidate values here may only contribute
# diagnostic evidence, never a published TF or safety clearance.
schema_version: 1
sensor_model: Hesai PandarXT-16
calibration_status: candidate_unconfirmed
confirmed: false
authorizes_tf_publication: false
authorizes_safety_integration: false
authorizes_motion: false

coordinate_convention:
  parent_frame: base_link
  child_frame: pandarxt16_link
  x: forward
  y: left
  z: up
  rotation: fixed-axis roll_pitch_yaw_radians

transform_candidate:
  translation_m:
    x: 0.130
    y: 0.015
    z: 0.014
  rotation_rpy_deg:
    roll: 0.385
    pitch: 0.905
    yaw: 90.0
  source: hesai_pandarxt16_axis_convention_20260915
  note: >
    yaw corrected from the rejected 20260813 cross-registration value (11.357) to
    90.0. The 11.357 figure came from a static dual-lidar registration that the
    20260813 report itself rejects (median NN 0.3516 m, 13.54% within 0.10 m); it
    is a failed measurement, not a calibration result. The correct yaw is
    deterministic, not measured: the Hesai driver computes
    x = d*cos(el)*sin(azi), y = d*cos(el)*cos(azi) (udp6_1_parser.h:162-165) while
    Hesai defines azi=0 at the cable outlet and azi=180 as the front direction, so
    the cloud's -y axis is the sensor front and the sensor frame needs Rz(+90) to
    become a ROS frame. The driver applies no correction
    (transform_flag: false, hesai_pandarxt16.yaml; TransformPoint() returns early
    when use_flag is false, general_parser.h:561). Measured forward bearing in the
    raw cloud is -90.00 deg (grid cross-correlation) / -90.60 deg (frame-wise ICP)
    on bag lio_align_20260914_195708, i.e. the sensor is mounted correctly and the
    cloud's +x points to the vehicle's left. roll/pitch remain the 20260813 ground
    fit and are unchanged; translation is unchanged.
    Multi-scene calibration output from scripts/go2w/calibrate_pandarxt16_extrinsics.py
    must overwrite this file's transform fields and set confirmed=true before any
    authorizes_* flag may be raised.

acceptance_thresholds:
  translation_residual_m: 0.05
  yaw_multi_scene_consistency_deg: 3.0
  minimum_valid_scenes: 3
  require_normal_diversity: true
