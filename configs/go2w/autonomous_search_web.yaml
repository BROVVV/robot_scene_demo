# Go2-W autonomous semantic search WebUI configuration (plan book §117).
#
# Everything here is optional: environment variables (AUTONOMOUS_SEARCH_*)
# and API request fields override these defaults.  Manual calibration items
# never block the WebUI (plan book §2).

web:
  host: 127.0.0.1
  port: 8765
  search_event_buffer: 500

search:
  # 死键（2026-09-17 逐行核实过一遍，结论见 44 行前那段注释）：
  # 本键与下面的 max_search_seconds / max_planning_cycles / max_motion_steps
  # 都不会被消费，改这里不改变真机行为。
  reasoner: semantic_navigation
  # 计划书 §6.6：真机自主搜索只允许 nav2。mock / mock_metric 仅供离线测试，
  # 由测试直接构造请求，不走这个文件。
  backend: nav2                  # nav2 | mock | mock_metric

  # 物体识别后端，透传到 run_semantic_exploration.py 的 --detector：
  #   grounded_sam —— 本地 GroundingDINO + SAM2 出真实 mask，每个物体因而带 3D
  #                   box（box_size），WebUI 三维视图画的是线框而不是红点；
  #                   目标的复核仍由 VLM 做（_verify_target，走 verify 模式）。
  #                   首次调用要加载模型（本机实测 24.7 s），常驻后单帧 0.4 s。
  #   llm          —— 云端 VLM 出全场景文本 + 关系，产不出 mask ⇒ box_size 恒为
  #                   None（见 run_semantic_exploration.py:982），物体只有红点。
  detector: grounded_sam
  # 计划书 §18.2/§19：视觉确认只是接近的开始。真实 Go2W 必须走完
  # target approach + 最终确认才算 TARGET_FOUND，所以这里是 false。
  finish_on_visual_confirmation: false
  # The WebUI search button enters the repository's existing
  # operator_supervised_experiment path.  The operator remains responsible
  # for holding the remote emergency stop; all motion bounds and per-step
  # stop behavior stay in the high-level executor.
  enable_autonomous_motion: true
  operator_supervised_experiment: true

  # D435 is the primary RGB-D camera; the WebUI start request can still opt
  # out by passing rgbd_source=false.
  rgbd_source: true
  rgbd_base_url: http://192.168.123.18:8080

  # SemanticNavigation V2 spatial exploration loop (PlaceGraph + Frontier +
  # LongTermGoalSelector + LocalGoalExecutor).
  spatial_v2: true

  # PandarXT-16 plain_slam supplies the metric map/frontiers.  Its provider
  # has camera-local fallback and remains mapping-assist only; it does not
  # replace /go2w/odom/fused or authorize motion.
  spatial_provider: plain_slam

  # Use RTAB-Map ROS2 topics when the D435 bridge + rtabmap_slam are running.
  # ``auto`` resolves to rtabmap when its topics are healthy, else degrades to
  # the camera-local relative provider (never blocks the search).
  rtabmap: false

  # --- 死键（2026-09-17 核实）---------------------------------------------
  # load_search_defaults() 确实把 max_search_seconds / max_planning_cycles /
  # max_motion_steps 读进了 defaults（search_models.py:220-223），
  # 但 SearchStartRequest.from_dict() 对这三个字段只用请求体取值
  # （search_models.py:123-125 的 value.get(...)），从不回落到 defaults；
  # reasoner 同理（同文件 :73）。所以这里写的数字没有任何消费者。
  #
  # 生效路径是：WebUI 启动请求体 → autonomous_search_worker.build_argv()
  # → run_semantic_exploration.py 的 argparse。请求体不带这些字段时，
  # 落到 argparse 默认值（--max-seconds 600.0 / --max-planning-cycles 100 /
  # --max-motion-steps 50 / --reasoner semantic_navigation）。
  # 这些默认值目前恰好和下面三个数字相同 —— 这正是这个坑不容易被发现的原因：
  # 改 yaml 看起来"生效了"，其实什么都没变。
  max_search_seconds: 600
  max_planning_cycles: 100
  max_motion_steps: 50
  verify_min_confidence: 0.6
  # Optional visual override; empty means use SILICONFLOW_VISION_MODEL.
  llm_model: ""

map:
  mode: auto                     # topological (current Go2-W) / metric (future)

supervision:
  operator_supervised: true
  stop_search_on_last_browser_disconnect: false

# --- Spatial semantic world-model tuning (plan §11 / §114) -------------------
spatial:
  provider: plain_slam

  rtabmap:
    enabled: auto
    map_topic: /rtabmap/map
    odom_topic: /rtabmap/odom
    map_frame: map
    odom_frame: odom
    camera_frame: d435_color_optical_frame
    base_frame: base_link

  camera_extrinsic:
    mode: tf2_then_nominal
    nominal_translation_m: [0.10, 0.0, 0.30]

  place_graph:
    merge_distance_m: 0.35
    # A Place is a relocation, not every primitive/action.  Wheel/fused odom
    # is the primary evidence; this prevents turn-only LIO drift from
    # manufacturing P2/P3.
    relocation_min_displacement_m: 0.50

  entity_map:
    base_merge_distance_m: 0.35
    confirm_min_observations: 2
    stale_after_seconds: 120
    geometry_weight: 0.60
    semantic_weight: 0.15
    place_weight: 0.10
    appearance_weight: 0.10
    temporal_weight: 0.05

  route_planner:
    mode: auto
    allow_unknown: false
    inflation_radius_m: 0.25
    max_waypoints: 32

  decision:
    keep_alternatives: 3

outputs:
  session_dir: outputs/live_runs
  events_jsonl: outputs/live_sessions

# --- 2026-08-26 plan: breadcrumb-safe reverse recovery ----------------------
go2w:
  backward_recovery:
    enabled: true
    default_step_m: 0.10
    min_step_m: 0.05
    max_step_m: 0.12
    max_age_sec: 8.0
    heading_tolerance_deg: 8.0
    max_per_place: 2
    max_consecutive: 2

# --- 2026-08-26 plan: topology-native navigation ----------------------------
topology:
  enabled: true
  execute_route_edges: true
  max_edge_failures: 2
  blocked_edge_retry_sec: 120
  place_merge_distance_m: 0.35
  heading_bin_deg: 30

frontier:
  source: topology_local_geometry
  heading_bin_deg: 30
  merge_bearing_deg: 15

memory:
  observation_memory: true
  experience_memory: true
  commonsense_prior: true

webui:
  topology_only: true
